<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="https://motorbike.jdge.cc/images/icon.png">
<title>Motorbike</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="main-container">
        <div class="header">
            <a class="header-link" href="https://jdge.cc" target="_blank" rel="noopener noreferrer">
                <div class="header-left">
                    <h1 class="title">MOTORBIKE</h1>
                </div>

                <div class="header-right">
                    <img src="images/icon.png" alt="Motorbike Icon">
                </div>
            </a>
        </div>

        <div class="nav-pills-bar">
            <a href="#gear" class="nav-pill">Gear</a>
            <a href="#bike" class="nav-pill">Bike</a>
            <a href="#accessories" class="nav-pill">Accessories</a>
            <a href="#first-aid" class="nav-pill">First Aid</a>
            <a href="#alterations" class="nav-pill">Alterations</a>
        </div>

        <div class="content">
            <div id="content-container">
                <!-- Items will be appended here by JS -->
            </div>
    
            <div class="footer-logos">
                <a href="https://www.nrma.com.au/" target="_blank" rel="noopener noreferrer">
                    <img src="images/nrma.png" alt="NRMA">
                </a>
    
                <a href="https://www.cfmoto.com.au/" target="_blank" rel="noopener noreferrer">
                    <img src="images/cfmoto.png" alt="CFMoto">
                </a>
                
                <a href="https://instagram.com/vixenbike" target="_blank" rel="noopener noreferrer">
                    <img src="images/instagram.png" alt="Instagram Icon">
                </a>

                <a href="https://github.com/megzjudge/motorbike/" target="_blank" rel="noopener noreferrer">
                    <img src="images/github.png" alt="GitHub Icon">
                </a>
            </div>
        </div>
    </div>
    <div id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-image" src="" alt="">
        <div id="lightbox-pdf"></div>
    </div>
    <div id="custom-tooltip" class="custom-tooltip">
        <span id="tooltip-text"></span>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
