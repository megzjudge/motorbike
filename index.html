<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Your Mobile Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        
        :root {
            --primary: #01b8c6;
        }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .card {
            box-shadow: 0 25px 50px -12px rgb(1 184 198 / 0.15);
        }
        
        .data-row {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .data-row:hover {
            background-color: rgb(1 184 198 / 0.05);
        }
        
        .video-emoji {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen pb-12">
    <div class="max-w-[420px] mx-auto bg-white min-h-screen shadow-2xl overflow-hidden">
        
        <!-- HEADER -->
        <div class="bg-[#01b8c6] px-6 py-5 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white rounded-2xl flex items-center justify-center text-2xl">📦</div>
                <h1 class="text-2xl font-semibold tracking-tight">CATALOG</h1>
            </div>
            <div class="flex items-center gap-2 text-sm font-medium">
                <div class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-3xl flex items-center gap-1">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
                    </span>
                    LIVE
                </div>
                <a href="#" onclick="window.location.reload()" class="text-white/80 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.058 11H1M12 3v2m0 16v2m9-9H15m-6 0a8 8 0 01-7.714-6.314M12 3a8 8 0 00-7.714 6.314" />
                    </svg>
                </a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="px-6 pt-6 pb-8">
            
            <!-- IMAGE -->
            <div id="image-container" class="mb-8 rounded-3xl overflow-hidden border-4 border-[#01b8c6]/20 shadow-2xl">
                <!-- Populated by JS -->
            </div>

            <!-- DATA CARD -->
            <div class="bg-zinc-900 rounded-3xl p-1 card">
                <div class="bg-white text-zinc-900 rounded-3xl px-6 py-6 divide-y divide-zinc-100">
                    
                    <!-- Row 1: Part -->
                    <div id="row-part" class="data-row flex justify-between items-center py-4 px-2 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">PART</span>
                        <span id="part-value" class="font-semibold text-lg"></span>
                    </div>
                    
                    <!-- Row 2: Brand -->
                    <div id="row-brand" class="data-row flex justify-between items-center py-4 px-2 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">BRAND</span>
                        <span id="brand-value" class="font-semibold text-lg"></span>
                    </div>
                    
                    <!-- Row 3: Brand Flag -->
                    <div id="row-flag" class="data-row flex justify-between items-center py-4 px-2 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">BRAND ORIGIN</span>
                        <span id="flag-value" class="text-4xl"></span>
                    </div>
                    
                    <!-- Row 4: Version -->
                    <div id="row-version" class="data-row flex justify-between items-center py-4 px-2 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">VERSION</span>
                        <span id="version-value" class="font-semibold text-lg"></span>
                    </div>
                    
                    <!-- Row 5: Safety Rating -->
                    <div id="row-safety" class="data-row flex justify-between items-center py-4 px-2 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">SAFETY RATING</span>
                        <a id="safety-link" target="_blank" class="flex items-center gap-2 font-semibold text-[#01b8c6] hover:text-[#01b8c6]/80 transition-colors">
                            <!-- Populated by JS -->
                        </a>
                    </div>
                </div>
            </div>

            <!-- VIDEO LINK -->
            <div class="mt-10 flex flex-col items-center">
                <a id="video-link" target="_blank" 
                   class="video-emoji group flex flex-col items-center gap-2 text-[#01b8c6] hover:scale-110 transition-all">
                    <div class="text-7xl mb-1">📹</div>
                    <span class="text-sm font-medium tracking-[2px] uppercase group-active:underline">WATCH VIDEOS</span>
                </a>
                <p class="text-zinc-400 text-xs mt-6 text-center max-w-[240px]">
                    Tap the camera emoji above to open the full video library
                </p>
            </div>
        </div>
    </div>

    <script>
        // ==================== TAILWIND CONFIG ====================
        tailwind.config = {
            content: [],
            theme: {
                extend: {
                    colors: {
                        primary: '#01b8c6'
                    }
                }
            }
        }

        // ==================== YOUR DATA (edit this!) ====================
        const data = {
            image: "https://picsum.photos/id/1015/800/1200",   // ← Replace with your image URL
            part: "Front Brake Pads",
            brand: "Brembo",
            brand_flag: "🇮🇹",
            version: "GT-R Performance",
            safety_rating: {
                text: "5★ Euro NCAP / ANCAP",
                url: "https://www.euroncap.com/en/results/brembo/1234"   // ← Your safety link
            },
            video_url: "https://www.youtube.com/watch?v=3JZ4pnN7gm8"     // ← Your video link
        }

        // ==================== RENDER FUNCTION ====================
        function renderPage() {
            // Image
            const imageHTML = `
                <img src="${data.image}" 
                     alt="${data.part}"
                     class="w-full h-auto object-cover aspect-[4/3]">
            `
            document.getElementById('image-container').innerHTML = imageHTML

            // Row 1 - Part
            document.getElementById('part-value').textContent = data.part

            // Row 2 - Brand
            document.getElementById('brand-value').textContent = data.brand

            // Row 3 - Brand Flag
            document.getElementById('flag-value').textContent = data.brand_flag

            // Row 4 - Version
            document.getElementById('version-value').textContent = data.version

            // Row 5 - Safety Rating
            const safetyEl = document.getElementById('safety-link')
            safetyEl.innerHTML = `
                ${data.safety_rating.text}
                <span class="text-2xl">↗</span>
            `
            safetyEl.href = data.safety_rating.url

            // Video link
            const videoEl = document.getElementById('video-link')
            videoEl.href = data.video_url
        }

        // ==================== INIT ====================
        window.onload = renderPage
    </script>
</body>
</html>
