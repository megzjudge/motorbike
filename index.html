<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="https://motorbike.jdge.cc/images/icon.png">
<title>Motorbike</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="main-container">
    <div class="header">
        <div class="header-left"><h1 class="title">MOTORBIKE</h1></div>
        <img src="images/icon.png" alt="Motorbike Icon" class="header-logo-right">
    </div>

    <div class="content">

        <!-- NAV BUTTONS -->
        <div class="nav-buttons">
            <button onclick="prevItem()">⬅ Previous</button>
            <button onclick="nextItem()">Next ➡</button>
        </div>

        <div id="image-container">
            <img id="main-image" src="" alt="">
        </div>

        <div class="data-card">
            <div class="data-inner">
                <div class="data-row">
                    <span class="label">PART</span>
                    <span id="part-value" class="value"></span>
                </div>
                <div class="data-row">
                    <span class="label">BRAND</span>
                    <div class="brand-row">
                        <span id="brand-value" class="value"></span>
                        <span id="flag-value" class="flag"></span>
                    </div>
                </div>
                <div class="data-row">
                    <span class="label">VERSION</span>
                    <a id="version-link" target="_blank" class="version-tag"></a>
                </div>
                <div class="data-row">
                    <span class="label">SAFETY RATING</span>
                    <div id="safety-container" class="safety-ratings"></div>
                </div>
            </div>
        </div>

        <a id="video-link" class="video-link" target="_blank">
            <div class="icon">📹</div>
            <span>WATCH VIDEOS</span>
        </a>

    </div>
</div>

<div id="lightbox">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-image" src="" alt="">
</div>

<script src="script.js"></script>
</body>
</html>
