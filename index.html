<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motorbike</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }
        
        .main-container {
            max-width: 768px;
            width: 100%;
            height: 100vh;
            margin: 0 auto;
            box-shadow: 0 30px 70px -15px rgb(0 0 0 / 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .data-card {
            border: 3px solid #01b8c6;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        }
        
        .data-row:hover {
            background-color: rgb(1 184 198 / 0.05);
        }
        
        .motorbike-emoji {
            filter: drop-shadow(0 0 12px #01b8c6) brightness(1.1) saturate(1.3);
        }
        
        .header-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="main-container bg-white">
        
        <!-- HEADER -->
        <div class="bg-[#01b8c6] px-8 py-5 flex items-center justify-between flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-4xl motorbike-emoji">🏍️</div>
                <h1 class="text-4xl font-semibold tracking-tighter text-white">MOTORBIKE</h1>
            </div>
            
            <!-- Logo on top right -->
            <img src="images/icon.png" alt="Logo" class="header-logo">
        </div>

        <!-- MAIN CONTENT -->
        <div class="flex-1 overflow-auto px-8 pt-8 pb-10">
            
            <!-- IMAGE -->
            <div id="image-container" class="mb-8 rounded-3xl overflow-hidden border-4 border-[#01b8c6]/30 shadow-2xl">
                <!-- JS populated -->
            </div>

            <!-- DATA CARD -->
            <div class="data-card bg-white rounded-3xl p-1 mb-10">
                <div class="bg-white text-zinc-900 rounded-3xl px-8 py-7 divide-y divide-zinc-100">
                    
                    <div id="row-part" class="data-row flex justify-between items-center py-5 px-3 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">PART</span>
                        <span id="part-value" class="font-semibold text-2xl"></span>
                    </div>
                    
                    <div id="row-brand" class="data-row flex justify-between items-center py-5 px-3 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">BRAND</span>
                        <div class="flex items-center gap-4">
                            <span id="brand-value" class="font-semibold text-2xl"></span>
                            <span id="flag-value" class="text-5xl"></span>
                        </div>
                    </div>
                    
                    <div id="row-version" class="data-row flex justify-between items-center py-5 px-3 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">VERSION</span>
                        <span id="version-value" class="font-semibold text-2xl"></span>
                    </div>
                    
                    <div id="row-safety" class="data-row flex justify-between items-center py-5 px-3 rounded-2xl">
                        <span class="font-medium text-zinc-500 text-sm tracking-widest uppercase">SAFETY RATING</span>
                        <a id="safety-link" target="_blank" class="flex items-center gap-3 font-semibold text-[#01b8c6] hover:text-[#01b8c6]/80 transition-colors text-xl"></a>
                    </div>
                </div>
            </div>

            <!-- VIDEO LINK -->
            <div class="flex flex-col items-center">
                <a id="video-link" target="_blank" 
                   class="flex flex-col items-center gap-3 text-[#01b8c6] hover:scale-110 active:scale-95 transition-all">
                    <div class="text-8xl">📹</div>
                    <span class="text-base font-medium tracking-widest uppercase">WATCH VIDEOS</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();

                // Image
                document.getElementById('image-container').innerHTML = `
                    <img src="${data.image}" alt="${data.part}" class="w-full h-auto object-cover">
                `;

                // Part
                document.getElementById('part-value').textContent = data.part;

                // Brand + Flag
                document.getElementById('brand-value').textContent = data.brand;
                document.getElementById('flag-value').textContent = data.brand_flag;

                // Version
                document.getElementById('version-value').textContent = data.version;

                // Safety Rating
                const safetyEl = document.getElementById('safety-link');
                safetyEl.innerHTML = `${data.safety_rating.text} <span class="text-3xl">↗</span>`;
                safetyEl.href = data.safety_rating.url;

                // Video
                document.getElementById('video-link').href = data.video_url;

            } catch (error) {
                console.error("Error loading data.json:", error);
                document.getElementById('image-container').innerHTML = `
                    <div class="p-12 text-center text-red-500">Failed to load data.json — make sure it's in the same folder</div>
                `;
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
